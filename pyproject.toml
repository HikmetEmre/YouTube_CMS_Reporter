[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cms-reporter"
version = "0.1.0"
description = "Royalty settlement, client reporting, channel backups and conflict alerts for YouTube CMS networks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    "msoffcrypto-tool>=5.4",
    "pyzipper>=0.3.6",
    "cryptography>=42",
    "reportlab>=4.0",
    "pypdf>=4.0",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
cms-reporter = "cms_reporter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cms_reporter = ["static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
