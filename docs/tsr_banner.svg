<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e30a17"/>
      <stop offset="1" stop-color="#b80812"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1280" height="360"/></clipPath>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- radar -->
  <g clip-path="url(#clip)">
    <g transform="translate(1010,180)" fill="none" stroke="#ffffff">
      <circle r="60"  stroke-opacity="0.55" stroke-width="2"/>
      <circle r="120" stroke-opacity="0.4"  stroke-width="2"/>
      <circle r="180" stroke-opacity="0.28" stroke-width="2"/>
      <circle r="240" stroke-opacity="0.16" stroke-width="2"/>
      <line x1="-250" y1="0" x2="250" y2="0" stroke-opacity="0.2" stroke-width="2"/>
      <line x1="0" y1="-250" x2="0" y2="250" stroke-opacity="0.2" stroke-width="2"/>
      <!-- sweep wedge -->
      <path d="M0 0 L180 0 A180 180 0 0 0 127 -127 Z" fill="url(#sweep)" stroke="none"/>
      <line x1="0" y1="0" x2="180" y2="0" stroke-width="3" stroke-opacity="0.9"/>
      <circle r="7" fill="#ffffff" stroke="none"/>
    </g>
    <!-- blips -->
    <g fill="#ffffff">
      <circle cx="1120" cy="120" r="8"/><circle cx="1120" cy="120" r="16" fill-opacity="0.25"/>
      <circle cx="935"  cy="95"  r="6"/><circle cx="935"  cy="95"  r="13" fill-opacity="0.25"/>
      <circle cx="905"  cy="245" r="7"/><circle cx="905"  cy="245" r="14" fill-opacity="0.25"/>
      <circle cx="1080" cy="275" r="5" fill-opacity="0.8"/>
    </g>
  </g>

  <!-- text -->
  <text x="70" y="110" font-size="20" font-weight="600" letter-spacing="4" fill="#ffffff" fill-opacity="0.85">TV GUIDES + STREAMING · WORLDWIDE</text>
  <text x="70" y="190" font-size="68" font-weight="800" fill="#ffffff">Turkish Series</text>
  <text x="70" y="262" font-size="68" font-weight="800" fill="#ffffff">Radar</text>
  <rect x="72" y="282" width="90" height="5" rx="2.5" fill="#ffffff"/>
  <text x="70" y="322" font-size="22" fill="#ffffff" fill-opacity="0.85">Where is a title on air, anywhere in the world?</text>
</svg>
